<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Undergoing Maintenance</title>
    <meta name="description" content="Nexus is undergoing maintenance. We have no idea how long this will take.">
    <meta name="theme-color" content="#f7f8fc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M26 12 16 7 6 12l10 5 10-5Z' fill='%23fff'/%3E%3Cpath d='M10 14.5V20c0 1.9 2.7 3.4 6 3.4s6-1.5 6-3.4v-5.5' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

    <style>
        :root {
            --bg: #f7f8fc;
            --card: #ffffff;
            --ink: #141a2e;
            --muted: #5b647a;
            --line: #e5e8f1;
            --brand: #4f46e5;
            --amber: #b45309;
            --amber-soft: #fef3c7;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 24px;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 720px;
            background:
                radial-gradient(720px 360px at 80% 0%, rgba(79, 70, 229, 0.13), transparent 70%),
                radial-gradient(560px 320px at 10% 0%, rgba(180, 83, 9, 0.10), transparent 70%),
                linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0) 74%);
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(560px, 100%);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 44px 40px 40px;
            box-shadow: 0 1px 2px rgba(20, 26, 46, 0.04), 0 30px 60px -30px rgba(20, 26, 46, 0.30);
            text-align: center;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -1px -1px auto -1px;
            height: 4px;
            border-radius: 24px 24px 0 0;
            background: linear-gradient(90deg, var(--brand), #7c73ff 50%, var(--amber));
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            font-weight: 750;
            font-size: 1.12rem;
            letter-spacing: -0.02em;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(150deg, #6d63ff, #3f37c9);
            display: grid;
            place-items: center;
            color: #fff;
            box-shadow: 0 8px 18px -8px rgba(79, 70, 229, 0.75);
            flex-shrink: 0;
        }

        .brand-mark svg { width: 22px; height: 22px; }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 30px;
            padding: 6px 14px;
            border-radius: 999px;
            background: var(--amber-soft);
            color: var(--amber);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.22);
        }

        h1 {
            margin-top: 20px;
            font-size: clamp(1.7rem, 5vw, 2.2rem);
            line-height: 1.15;
            letter-spacing: -0.03em;
            font-weight: 800;
        }

        h1 em {
            font-style: normal;
            color: var(--brand);
        }

        p {
            margin-top: 16px;
            color: var(--muted);
            font-size: 1rem;
        }

        p.eta {
            margin-top: 10px;
            font-weight: 600;
            color: var(--ink);
        }

        .divider {
            margin: 30px auto 0;
            border-top: 1px dashed var(--line);
        }

        footer {
            margin-top: 22px;
            font-size: 0.78rem;
            color: var(--muted);
            font-family: var(--mono);
            letter-spacing: 0.04em;
        }

        @media (max-width: 520px) {
            .card { padding: 34px 24px 30px; border-radius: 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 9.5 12 4.5 2 9.5l10 5 10-5Z"></path>
                    <path d="M6.5 12v4.4c0 1.7 2.5 3.1 5.5 3.1s5.5-1.4 5.5-3.1V12"></path>
                </svg>
            </span>
            <span>Nexus</span>
        </div>

        <div class="status"><span class="status-dot" aria-hidden="true"></span> Maintenance</div>

        <h1>Nexus is undergoing <em>maintenance</em>.</h1>

        <p class="eta">We have no idea how long this will take.</p>
        <p>Thanks for your patience &mdash; please check back later.</p>

        <div class="divider"></div>

        <footer>&copy; 2026 Nexus</footer>
    </main>

</body>
</html>
